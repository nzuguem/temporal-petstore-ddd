[tools]
java = "temurin-25.0.2+10.0.LTS"
maven = "3.9.15"

[tasks."release+deploy"]
usage = 'arg "[environment]" env="VERSION"'
run = '''
mvn clean install -DskipTests
docker build -t localhost:5001/petstore-worker:${usage_environment:-} . --push
cd ./k8s
  kustomize edit set image localhost:5001/petstore-worker=localhost:5001/petstore-worker:${usage_environment:-}
cd ..
kubectl apply -k ./k8s
'''