apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: petstore-worker
spec:
  hostnames:
    - petstore-worker.127.0.0.1.nip.io
  parentRefs:
    - name: kubernetes-sandbox-gateway
      namespace: nginx-gateway-system
      sectionName: http
  rules:
    - backendRefs:
        - name: petstore-worker
          port: 8080