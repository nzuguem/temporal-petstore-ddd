apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: petstore-worker
spec:
  workerOptions:
    connectionRef:
      name: temporal
    temporalNamespace: variant
  rollout:
    strategy: AllAtOnce
  sunset:
    scaledownDelay: 15m   # Quick scaledown
    deleteDelay: 2h       # Minimal retention
  template:
    metadata:
      labels:
        app: petstore-worker
    spec:
      containers:
        - name: petstore-worker
          image: localhost:5001/petstore-worker
          envFrom:
          - configMapRef:
              name: petstore-worker